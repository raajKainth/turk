<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="styles.css" />
  <title>Profile</title>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar">
    <div class="logo">
      <img src="/assets/css-logo-shield.webp" alt="Logo" />
    </div>
    <ul class="nav-links">
      <!-- Regular Link -->
      <li><a href="home.html">Home</a></li>

      <!-- Worker Dropdown using a select element -->
      <li>
        <select onchange="if (this.value) window.location.href=this.value">
          <option value="">Worker</option>
          <option value="login.html">Login</option>
          <option value="profile.html">Profile</option>
          <option value="work.html">Work</option>
          <option value="applied.html">My Applied Tasks</option>
        </select>
      </li>

      <!-- Requestor Dropdown using a select element -->
      <li>
        <select onchange="if (this.value) window.location.href=this.value">
          <option value="">Requestor</option>
          <option value="requestorlogin.html">Login</option>
          <option value="requestorprofile.html">Profile</option>
          <option value="task.html">Task Creation</option>
          <option value="postedtask.html">My Posted Tasks</option>
        </select>
      </li>
    </ul>
  </nav>

  <h2>Your Profile</h2>
  <div>
    <form id="profileForm">
      <p>
        Name: <input type="text" id="nameInput" name="name" />
      </p>
      <p>
        Email: <input type="email" id="emailInput" name="email" />
      </p>
      <p>
        Program: <input type="text" id="programInput" name="program" />
      </p>
      <p>
        Skills: <input type="text" id="skillsInput" name="skills" />
      </p>
      <p>
        Experience: <input type="text" id="experienceInput" name="experience" />
      </p>
      <p>
        Password: <input type="password" id="passwordInput" name="password" />
      </p>
      <p>
        Resume: 
        <input type="file" id="resumeInput" name="resume" accept=".pdf,.doc,.docx" />
      </p>
      <!-- This div will display a link to view the uploaded resume (if any) -->
      <div id="resumePreview"></div>
      <button type="button" onclick="saveProfile()">Save</button>
    </form>
  </div>
  
  <!-- Logout Button -->
  <button class="logout-btn" onclick="logout()">Logout</button>

  <script>
    window.onload = function() {
      const worker = JSON.parse(localStorage.getItem('worker'));
      if (!worker) {
        alert('Please log in first');
        window.location.href = 'login.html'; // Redirect to login page
        return;
      }

      // Pre-fill the form with worker details from localStorage
      document.getElementById('nameInput').value = worker.name || '';
      document.getElementById('emailInput').value = worker.email || '';
      document.getElementById('programInput').value = worker.program || '';
      document.getElementById('skillsInput').value = worker.skills || '';
      document.getElementById('experienceInput').value = worker.experience || '';

      // If a resume was uploaded previously, display a link to view it.
      if (worker.resume) {
        const resumePreview = document.getElementById('resumePreview');
        resumePreview.innerHTML = `<a href="${worker.resume}" target="_blank">View Uploaded Resume</a>`;
      }
    };

    // Save the updated profile data to the server
    function saveProfile() {
      const worker = JSON.parse(localStorage.getItem('worker'));
      const passwordInput = document.getElementById('passwordInput').value;
      const updatedPassword = passwordInput ? hashPassword(passwordInput) : worker.password;

      const resumeInput = document.getElementById('resumeInput');
      const formData = new FormData();
      formData.append('name', document.getElementById('nameInput').value);
      formData.append('email', document.getElementById('emailInput').value);
      formData.append('program', document.getElementById('programInput').value);
      formData.append('skills', document.getElementById('skillsInput').value);
      formData.append('experience', document.getElementById('experienceInput').value);
      formData.append('password', updatedPassword);
      if (resumeInput.files.length > 0) {
        formData.append('resume', resumeInput.files[0]);
      }

      fetch('http://localhost:3000/updateProfile', {
        method: 'POST',
        body: formData,
      })
      .then(response => response.json())
      .then(data => {
        alert('Profile updated successfully!');
        // Update localStorage with the new worker details
        localStorage.setItem('worker', JSON.stringify(data));
        window.location.href = 'profile.html'; // Reload profile page
      })
      .catch(error => {
        console.error('Error updating profile:', error);
        alert('An error occurred while saving your profile.');
      });
    }

    // Example password hashing function (for demonstration only)
    function hashPassword(password) {
      return btoa(password);  // In production, use a more secure hashing mechanism
    }

    // Logout function
    function logout() {
      localStorage.removeItem('worker');  // Clear the worker data from localStorage
      window.location.href = 'login.html';  // Redirect to login page
    }
  </script>
</body>
</html>
