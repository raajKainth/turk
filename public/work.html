<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
  <title>Available Tasks for Workers</title>
  <style>
    /* Table Styles */
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 20px 0;
    }
    
    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #ddd;
    }
    
    th {
      background-color: #f2f2f2;
      font-weight: bold;
    }
    
    tr:hover {
      background-color: #f5f5f5;
    }
    
    /* Button Styles */
    .apply-btn {
      background-color: #4CAF50;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    
    .delete-btn {
      background-color: #f44336;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    
    .apply-btn:hover {
      background-color: #45a049;
    }
    
    .delete-btn:hover {
      background-color: #d32f2f;
    }
    
    .apply-btn:disabled, .delete-btn:disabled {
      background-color: #cccccc;
      cursor: not-allowed;
    }
    
    /* Status Styles */
    .status-pending {
      color: #FFA500;
      font-weight: bold;
    }
    
    .status-accepted {
      color: #008000;
      font-weight: bold;
    }
    
    .status-rejected {
      color: #FF0000;
      font-weight: bold;
    }
    
    /* Message Styles */
    .message {
      padding: 20px;
      text-align: center;
      color: #666;
      font-style: italic;
    }
    
    /* Container Styles */
    .section {
      margin-bottom: 40px;
    }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar">
    <div class="logo">
      <img src="/assets/css-logo-shield.webp" alt="Logo"/>
    </div>
    <ul class="nav-links">
      <li><a href="home.html">Home</a></li>
      <li>
        <select onchange="if (this.value) window.location.href=this.value">
          <option value="">Worker</option>
          <option value="login.html">Login</option>
          <option value="profile.html">Profile</option>
          <option value="work.html">Work</option>
          <option value="applied.html">My Applied Tasks</option>
        </select>
      </li>
      <li>
        <select onchange="if (this.value) window.location.href=this.value">
          <option value="">Requestor</option>
          <option value="requestorlogin.html">Login</option>
          <option value="requestorprofile.html">Profile</option>
          <option value="task.html">Task Creation</option>
          <option value="postedtask.html">My Posted Tasks</option>
        </select>
      </li>
    </ul>
  </nav>

  <div class="container">
    <!-- Available Tasks Section -->
    <div class="section">
      <h2>Available Tasks</h2>
      <div id="tasksContainer" class="message">Loading available tasks...</div>
    </div>
    
    <!-- Applied Tasks Section -->
    <div class="section">
      <h2>My Applied Tasks</h2>
      <div id="appliedTasksContainer" class="message">Loading your applied tasks...</div>
    </div>
  </div>

  <script>
    // Main function that runs when page loads
    window.onload = function() {
      // Check authentication
      const worker = JSON.parse(localStorage.getItem('user')) || JSON.parse(localStorage.getItem('worker'));
      if (!worker) {
        alert("Please log in as a worker to view tasks.");
        window.location.href = "login.html";
        return;
      }

      if (!worker.email) {
        alert('Worker email is missing. Please log in again.');
        window.location.href = 'login.html';
        return;
      }

      console.log("Logged in worker:", worker);
      
      // Load both sections
      loadAvailableTasks(worker);
      loadAppliedTasks(worker);
    };

    // Function to load available tasks
    function loadAvailableTasks(worker) {
      fetch('http://localhost:3000/getAllTasks')
        .then(response => response.json())
        .then(tasks => {
          const container = document.getElementById('tasksContainer');
          
          if (!tasks || tasks.length === 0) {
            container.innerHTML = '<p class="message">No tasks available at the moment.</p>';
            return;
          }
          
          let tableHTML = `
            <table>
              <thead>
                <tr>
                  <th>Title</th>
                  <th>Description</th>
                  <th>Deadline</th>
                  <th>Reward</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody>`;
          
          tasks.forEach(task => {
            tableHTML += `
              <tr data-task-id="${task.id}">
                <td>${task.title || 'N/A'}</td>
                <td>${task.description || 'N/A'}</td>
                <td>${task.deadline ? new Date(task.deadline).toLocaleDateString() : 'N/A'}</td>
                <td>${task.reward ? task.reward : 'N/A'}</td>
                <td><button class="apply-btn" onclick="applyToTask('${task.id}', this)">Apply</button></td>
              </tr>`;
          });
          
          tableHTML += '</tbody></table>';
          container.innerHTML = tableHTML;
        })
        .catch(error => {
          console.error("Error fetching available tasks:", error);
          document.getElementById('tasksContainer').innerHTML = 
            '<p class="message">Error loading available tasks. Please try again later.</p>';
        });
    }

    // Function to load applied tasks
    function loadAppliedTasks(worker) {
      const url = `http://localhost:3000/api/workerAppliedTasks?workerEmail=${encodeURIComponent(worker.email)}`;
      console.log("Fetching applied tasks from:", url);
      
      fetch(url)
        .then(response => {
          if (!response.ok) throw new Error(`HTTP error! Status: ${response.status}`);
          return response.json();
        })
        .then(data => {
          const container = document.getElementById('appliedTasksContainer');
          const tasks = Array.isArray(data) ? data : (data.tasks || []);
          
          if (tasks.length === 0) {
            container.innerHTML = '<p class="message">You haven\'t applied to any tasks yet.</p>';
            return;
          }
          
          let tableHTML = `
            <table>
              <thead>
                <tr>
                  <th>Title</th>
                  <th>Description</th>
                  <th>Deadline</th>
                  <th>Reward</th>
                  <th>Status</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody>`;
          
          tasks.forEach(task => {
            const statusClass = `status-${(task.status || 'pending').toLowerCase()}`;
            tableHTML += `
              <tr data-task-id="${task.id}">
                <td>${task.title || 'N/A'}</td>
                <td>${task.description || 'N/A'}</td>
                <td>${task.deadline ? new Date(task.deadline).toLocaleDateString() : 'N/A'}</td>
                <td>${task.reward ? task.reward : 'N/A'}</td>
                <td class="${statusClass}">${task.status || 'Pending'}</td>
                <td>
                  <button class="delete-btn" onclick="deleteApplication('${task.id}', '${worker.email}', this)">
                    Delete
                  </button>
                </td>
              </tr>`;
          });
          
          tableHTML += '</tbody></table>';
          container.innerHTML = tableHTML;
        })
        .catch(error => {
          console.error("Error fetching applied tasks:", error);
          document.getElementById('appliedTasksContainer').innerHTML = 
            '<p class="message">Error loading your applied tasks. Please try again later.</p>';
        });
    }

    // Function to handle task applications
    function applyToTask(taskId, buttonElement) {
      const worker = JSON.parse(localStorage.getItem('user')) || JSON.parse(localStorage.getItem('worker'));
      if (!worker) {
        alert("Please log in as a worker to apply for tasks.");
        window.location.href = "login.html";
        return;
      }

      // Disable button during application
      buttonElement.disabled = true;
      buttonElement.textContent = 'Applying...';

      const payload = {
        taskId: taskId,
        workerProfile: worker
      };

      fetch('http://localhost:3000/applyTask', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      })
      .then(response => response.json())
      .then(data => {
        if (data.error) {
          alert("Error: " + data.error);
        } else {
          alert("Application submitted successfully!");
          // Refresh both sections
          loadAvailableTasks(worker);
          loadAppliedTasks(worker);
        }
      })
      .catch(error => {
        console.error("Error applying for task:", error);
        alert("An error occurred while applying for the task.");
      })
      .finally(() => {
        buttonElement.disabled = false;
        buttonElement.textContent = 'Apply';
      });
    }

    // Function to delete an application
    function deleteApplication(taskId, workerEmail, buttonElement) {
      if (!confirm("Are you sure you want to delete this application?")) {
        return;
      }

      // Disable button during deletion
      buttonElement.disabled = true;
      buttonElement.textContent = 'Deleting...';

      fetch('http://localhost:3000/deleteApplication', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ taskId, workerEmail })
      })
      .then(response => response.json())
      .then(data => {
        if (data.error) {
          alert("Error: " + data.error);
        } else {
          alert("Application deleted successfully!");
          // Refresh the applied tasks section
          const worker = JSON.parse(localStorage.getItem('user')) || JSON.parse(localStorage.getItem('worker'));
          loadAppliedTasks(worker);
        }
      })
      .catch(error => {
        console.error("Error deleting application:", error);
        alert("An error occurred while deleting the application.");
      })
      .finally(() => {
        buttonElement.disabled = false;
        buttonElement.textContent = 'Delete';
      });
    }
  </script>
</body>
</html>
