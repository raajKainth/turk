<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
  <title>Available Tasks for Workers</title>  
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar">
    <div class="logo">
      <img src="/assets/css-logo-shield.webp" alt="Logo"/>
    </div>
    <ul class="nav-links">
      <!-- Regular Link -->
      <li><a href="home.html">Home</a></li>

      <!-- Worker Dropdown using a select element -->
      <li>
        <select onchange="if (this.value) window.location.href=this.value">
          <option value="">Worker</option>
          <option value="login.html">Login</option>
          <option value="profile.html">Profile</option>
          <option value="work.html">Work</option>
          <option value="applied.html">My Applied Tasks</option>
        </select>
      </li>

      <!-- Requestor Dropdown using a select element -->
      <li>
        <select onchange="if (this.value) window.location.href=this.value">
          <option value="">Requestor</option>
          <option value="requestorlogin.html">Login</option>
          <option value="requestorprofile.html">Profile</option>
          <option value="task.html">Task Creation</option>
          <option value="postedtask.html">My Posted Tasks</option>
        </select>
      </li>
    </ul>
  </nav>

  <h2>Available Tasks</h2>
  <div id="tasksContainer"></div>
  
  <h2>My Applied Tasks</h2>
  <div id="appliedTasksContainer"></div>

  <script>
    // When the page loads, verify the worker is logged in and fetch tasks.
    window.onload = function() {
      // Check if the worker is logged in (assumed stored under "user" in localStorage)
      const worker = JSON.parse(localStorage.getItem('user'));
      if (!worker) {
        alert("Please log in as a worker to view tasks.");
        window.location.href = "login.html";
        return;
      }

      // Fetch all tasks from the server.
      fetch('http://localhost:3000/getAllTasks')
        .then(response => response.json())
        .then(tasks => {
          const container = document.getElementById('tasksContainer');
          if (!tasks || tasks.length === 0) {
            container.innerHTML = "<p>No tasks available at the moment.</p>";
            return;
          }
          
          // Create table structure for available tasks.
          const table = document.createElement('table');
          table.className = 'available-tasks-table';
          
          // Table header with columns: Title, Description, Deadline, Reward, Action.
          const thead = document.createElement('thead');
          thead.innerHTML = `
            <tr>
              <th>Title</th>
              <th>Description</th>
              <th>Deadline</th>
              <th>Reward</th>
              <th>Action</th>
            </tr>
          `;
          table.appendChild(thead);
          
          // Table body populated with tasks.
          const tbody = document.createElement('tbody');
          tasks.forEach(task => {
            const tr = document.createElement('tr');
            // Title
            const tdTitle = document.createElement('td');
            tdTitle.textContent = task.title;
            tr.appendChild(tdTitle);
            // Description
            const tdDescription = document.createElement('td');
            tdDescription.textContent = task.description;
            tr.appendChild(tdDescription);
            // Deadline
            const tdDeadline = document.createElement('td');
            tdDeadline.textContent = task.deadline;
            tr.appendChild(tdDeadline);
            // Reward
            const tdReward = document.createElement('td');
            tdReward.textContent = task.reward;
            tr.appendChild(tdReward);
            // Action: Apply Button
            const tdAction = document.createElement('td');
            const applyButton = document.createElement('button');
            applyButton.className = 'apply-btn';
            applyButton.textContent = 'Apply';
            applyButton.onclick = function() {
              applyToTask(task.id);
            };
            tdAction.appendChild(applyButton);
            tr.appendChild(tdAction);
            
            tbody.appendChild(tr);
          });
          table.appendChild(tbody);
          container.appendChild(table);
        })
        .catch(error => {
          console.error("Error fetching tasks:", error);
          document.getElementById('tasksContainer').innerHTML = "<p>Error loading tasks.</p>";
        });
        
      // Load tasks that the worker has applied for.
      fetch(`http://localhost:3000/getWorkerAppliedTasks?username=${encodeURIComponent(worker.username)}`)
        .then(response => response.json())
        .then(appliedTasks => {
          const container = document.getElementById('appliedTasksContainer');
          if (!appliedTasks || appliedTasks.length === 0) {
            container.innerHTML = "<p>No applied tasks yet.</p>";
            return;
          }
          
          // Create table structure for applied tasks.
          const table = document.createElement('table');
          table.className = 'applied-tasks-table';
          
          // Table header with columns: Title, Description, Deadline, Reward.
          const thead = document.createElement('thead');
          thead.innerHTML = `
            <tr>
              <th>Title</th>
              <th>Description</th>
              <th>Deadline</th>
              <th>Reward</th>
            </tr>
          `;
          table.appendChild(thead);
          
          // Table body populated with applied tasks.
          const tbody = document.createElement('tbody');
          appliedTasks.forEach(task => {
            const tr = document.createElement('tr');
            // Title
            const tdTitle = document.createElement('td');
            tdTitle.textContent = task.title;
            tr.appendChild(tdTitle);
            // Description
            const tdDescription = document.createElement('td');
            tdDescription.textContent = task.description;
            tr.appendChild(tdDescription);
            // Deadline
            const tdDeadline = document.createElement('td');
            tdDeadline.textContent = task.deadline;
            tr.appendChild(tdDeadline);
            // Reward
            const tdReward = document.createElement('td');
            tdReward.textContent = task.reward;
            tr.appendChild(tdReward);
            
            tbody.appendChild(tr);
          });
          table.appendChild(tbody);
          container.appendChild(table);
        })
        .catch(error => {
          console.error("Error fetching applied tasks:", error);
          document.getElementById('appliedTasksContainer').innerHTML = "<p>Error loading applied tasks.</p>";
        });
    };

    // Function to apply for a task.
    function applyToTask(taskId) {
      // Retrieve the worker's profile from localStorage.
      const worker = JSON.parse(localStorage.getItem('user'));
      if (!worker) {
        alert("Please log in as a worker to apply for tasks.");
        window.location.href = "login.html";
        return;
      }

      // Build payload with taskId and worker's profile.
      const payload = {
        taskId: taskId,
        workerProfile: worker
      };

      // Send application to the server.
      fetch('http://localhost:3000/applyTask', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      })
      .then(response => response.json())
      .then(data => {
        if (data.error) {
          alert("Error applying for task: " + data.error);
        } else {
          alert("Application successful! The requestor has been notified with your profile details.");
          // Refresh the applied tasks list after successful application.
          document.getElementById('appliedTasksContainer').innerHTML = "";
          const worker = JSON.parse(localStorage.getItem('user'));
          fetch(`http://localhost:3000/getWorkerAppliedTasks?username=${encodeURIComponent(worker.username)}`)
            .then(response => response.json())
            .then(appliedTasks => {
              const container = document.getElementById('appliedTasksContainer');
              if (!appliedTasks || appliedTasks.length === 0) {
                container.innerHTML = "<p>No applied tasks yet.</p>";
                return;
              }
              
              const table = document.createElement('table');
              table.className = 'applied-tasks-table';
              
              const thead = document.createElement('thead');
              thead.innerHTML = `
                <tr>
                  <th>Title</th>
                  <th>Description</th>
                  <th>Deadline</th>
                  <th>Reward</th>
                </tr>
              `;
              table.appendChild(thead);
              
              const tbody = document.createElement('tbody');
              appliedTasks.forEach(task => {
                const tr = document.createElement('tr');
                const tdTitle = document.createElement('td');
                tdTitle.textContent = task.title;
                tr.appendChild(tdTitle);
                const tdDescription = document.createElement('td');
                tdDescription.textContent = task.description;
                tr.appendChild(tdDescription);
                const tdDeadline = document.createElement('td');
                tdDeadline.textContent = task.deadline;
                tr.appendChild(tdDeadline);
                const tdReward = document.createElement('td');
                tdReward.textContent = task.reward;
                tr.appendChild(tdReward);
                tbody.appendChild(tr);
              });
              table.appendChild(tbody);
              container.appendChild(table);
            })
            .catch(error => {
              console.error("Error fetching applied tasks:", error);
              document.getElementById('appliedTasksContainer').innerHTML = "<p>Error loading applied tasks.</p>";
            });
        }
      })
      .catch(error => {
        console.error("Error applying for task:", error);
        alert("An error occurred while applying for the task.");
      });
    }
  </script>
</body>
</html>
